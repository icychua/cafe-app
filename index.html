<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 40px 16px;
      color: #222;
    }

    .calculator {
      max-width: 560px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr 90px 80px;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .price {
      text-align: right;
    }

    input[type="number"] {
      width: 60px;
      padding: 7px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    #total {
      margin-top: 24px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h1>Café Bill Calculator</h1>

    <div class="item">
      <span>Chicken Rice</span>
      <span class="price">$4.50</span>
      <input type="number" min="0" value="0" data-price="4.50">
    </div>

    <div class="item">
      <span>Nasi Lemak</span>
      <span class="price">$4.00</span>
      <input type="number" min="0" value="0" data-price="4.00">
    </div>

    <div class="item">
      <span>Laksa</span>
      <span class="price">$5.00</span>
      <input type="number" min="0" value="0" data-price="5.00">
    </div>

    <div class="item">
      <span>Kopi</span>
      <span class="price">$1.50</span>
      <input type="number" min="0" value="0" data-price="1.50">
    </div>

    <div class="item">
      <span>Teh</span>
      <span class="price">$1.30</span>
      <input type="number" min="0" value="0" data-price="1.30">
    </div>

    <div class="item">
      <span>Milo</span>
      <span class="price">$2.00</span>
      <input type="number" min="0" value="0" data-price="2.00">
    </div>

    <button onclick="calculateBill()">Calculate Bill</button>

    <div id="total">Total: $0.00</div>
  </div>

  <script>
    function calculateBill() {
      const inputs = document.querySelectorAll('input[data-price]');
      let total = 0;

      inputs.forEach(input => {
        const quantity = Math.max(0, parseInt(input.value) || 0);
        const price = parseFloat(input.dataset.price);

        total += quantity * price;
      });

      document.getElementById('total').textContent =
        'Total: $' + total.toFixed(2);
    }
  </script>

</body>
</html>
